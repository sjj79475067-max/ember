<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect width="400" height="400" rx="80" fill="url(#bg)"/>

  <!-- 熊猫头 -->
  <g transform="translate(200, 180)">
    <!-- 左耳 -->
    <circle cx="-80" cy="-60" r="35" fill="#1F2937"/>
    <!-- 右耳 -->
    <circle cx="80" cy="-60" r="35" fill="#1F2937"/>

    <!-- 脸 -->
    <circle cx="0" cy="0" r="90" fill="#F3F4F6"/>

    <!-- 左眼眶 -->
    <ellipse cx="-35" cy="-15" rx="28" ry="32" fill="#1F2937"/>
    <!-- 右眼眶 -->
    <ellipse cx="35" cy="-15" rx="28" ry="32" fill="#1F2937"/>

    <!-- 左眼珠 -->
    <ellipse cx="-35" cy="-12" rx="12" ry="16" fill="#FFFFFF"/>
    <circle cx="-35" cy="-8" r="6" fill="#1F2937"/>

    <!-- 右眼珠(斜眼看) -->
    <ellipse cx="38" cy="-12" rx="12" ry="16" fill="#FFFFFF"/>
    <circle cx="38" cy="-8" r="6" fill="#1F2937"/>

    <!-- 鼻子 -->
    <ellipse cx="0" cy="15" rx="18" ry="12" fill="#1F2937"/>

    <!-- 嘴(不屑的嘴) -->
    <path d="M -25 35 Q -10 42 0 40 Q 10 38 28 45"
          stroke="#1F2937" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- 腮红(表示傲娇) -->
    <circle cx="-70" cy="10" r="15" fill="#F87171" opacity="0.5"/>
    <circle cx="70" cy="10" r="15" fill="#F87171" opacity="0.5"/>
  </g>

  <!-- 文字:管你屁事 -->
  <g transform="translate(200, 320)" filter="url(#shadow)">
    <text x="0" y="0"
          font-family="PingFang SC, Microsoft YaHei, sans-serif"
          font-size="56"
          font-weight="900"
          fill="#1F2937"
          text-anchor="middle"
          letter-spacing="4">
      管你屁事
    </text>
  </g>

  <!-- 小装饰:对话气泡边框 -->
  <g opacity="0.3">
    <rect x="30" y="280" width="340" height="80" rx="40"
          fill="none" stroke="#1F2937" stroke-width="3" stroke-dasharray="8,8"/>
  </g>
</svg>
