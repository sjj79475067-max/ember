<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38BDF8"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="400" rx="80" fill="url(#bgGrad)"/>
  
  <!-- 剪贴板主体 -->
  <g transform="translate(200, 200)">
    <!-- 剪贴板背板 -->
    <rect x="-80" y="-100" width="160" height="200" rx="12" fill="#334155" opacity="0.6"/>
    
    <!-- 夹子 -->
    <rect x="-30" y="-110" width="60" height="20" rx="10" fill="url(#clipGrad)" filter="url(#glow)"/>
    
    <!-- 清单项 (打勾+未完成) -->
    <!-- 已完成项 1 -->
    <g opacity="0.5">
      <circle cx="-55" cy="-60" r="10" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
      <path d="M -60 -60 L -55 -55 L -48 -65" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-40" y1="-60" x2="40" y2="-60" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <!-- 已完成项 2 -->
    <g opacity="0.5">
      <circle cx="-55" cy="-20" r="10" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
      <path d="M -60 -20 L -55 -15 L -48 -25" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-40" y1="-20" x2="20" y2="-20" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <!-- 进行中项 (发光) -->
    <g filter="url(#glow)">
      <circle cx="-55" cy="20" r="10" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
      <line x1="-40" y1="20" x2="50" y2="20" stroke="#F8FAFC" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    
    <!-- 待办项 -->
    <g opacity="0.4">
      <circle cx="-55" cy="60" r="10" fill="none" stroke="#64748B" stroke-width="2.5"/>
      <line x1="-40" y1="60" x2="35" y2="60" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <!-- Agent 小图标 (右下角) -->
    <g transform="translate(65, 75)">
      <circle cx="0" cy="0" r="18" fill="#3B82F6" opacity="0.9"/>
      <circle cx="-4" cy="-3" r="2.5" fill="#F8FAFC"/>
      <circle cx="4" cy="-3" r="2.5" fill="#F8FAFC"/>
      <path d="M -6 4 Q 0 8 6 4" fill="none" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
