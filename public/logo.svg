<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noiseOut"/>
      <feColorMatrix type="saturate" values="0" in="noiseOut" result="greyNoise"/>
      <feBlend in="SourceGraphic" in2="greyNoise" mode="multiply" result="blended"/>
      <feComposite in="blended" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#g1)"/>
  <rect width="512" height="512" rx="96" fill="#fff" opacity=".03" filter="url(#noise)"/>
  <line x1="0" y1="0" x2="512" y2="512" stroke="#e63946" stroke-width="1.5" opacity=".15"/>
  <line x1="512" y1="0" x2="0" y2="512" stroke="#e63946" stroke-width="1.5" opacity=".15"/>
  <text x="256" y="216" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="192" font-weight="900" fill="#f0f0f0" text-anchor="middle" dominant-baseline="middle" letter-spacing="-4">管</text>
  <text x="256" y="380" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="88" font-weight="700" fill="#e63946" text-anchor="middle" dominant-baseline="middle" letter-spacing="8">你屁事</text>
  <line x1="80" y1="440" x2="432" y2="440" stroke="#e63946" stroke-width="2" opacity=".4"/>
</svg>
